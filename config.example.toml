# Copy to ~/.config/jarvis/config.toml and edit. Missing keys fall back to these defaults.

[persona]
address = "sir"                # how JARVIS addresses the user
timezone = "Europe/Prague"

[llm]
base_url = "http://127.0.0.1:8401/v1"   # llama-swap (never 3000/8085/8086/8090/8099/11434)
model = "jarvis"
idle_unload_s = 600            # (llama-swap's ttl is only a safety net now; see fast_/deep_idle_unload_s)
history_turns = 12
voice_max_tokens = 300
voice_temperature = 0.7
deep_max_tokens = 4000
deep_temperature = 0.6
backend = "auto"               # "llama-swap" | "ollama" | "auto" (port 11434 means ollama)
thinking_knob = "auto"         # "chat_template_kwargs" (llama-server) | "reasoning_effort" (ollama) | "auto"
request_timeout_s = 300        # a cold load of the 35B model can take a while
# Section 12 (docs/tuning.md "Fast voice model"): a small model is the voice brain, the 35B above (`model`) does
# deep_think and takes over a turn the small model gets wrong. Both can be loaded at once (llama-swap matrix).
fast_model = "qwen35-4b"       # llama-swap model id of the voice model; "" = none (all turns on `model`)
fast_temperature = 0.2         # its voice temperature: at 0.7 the small models skipped tool calls far more often
voice_brain = "fast"           # "fast" | "smart" (all voice turns on `model`). The pill menu overrides this
                               # at runtime (llm.brain.set, saved in ~/.local/state/jarvis/state.json)
fallback = true                # retry a turn once on `model` if the fast model calls an unknown tool, sends
                               # broken JSON arguments, or claims a draft it never made
# Section 20 (docs/tuning.md "Voice model on the GPU only while talking"): where the fast model lives.
#   "on_demand": 0 VRAM while idle, weights hot in the RAM page cache. A wake trigger (before the Whisper check),
#                a pill click, SUPER+J / the HUD start the load (1.3 s, while the user is still talking); it leaves
#                the GPU fast_idle_unload_s after the session went idle (never mid-turn, mid-speech or during a
#                computer_task). "Go to sleep" / "Unload now" unload it too.
#   "resident":  section 12's behaviour: always loaded, reloaded if llama-swap restarts.
# The pill menu ("Voice model: GPU only when talking / always on GPU") overrides this at runtime
# (llm.fast.gpu_mode, saved in ~/.local/state/jarvis/state.json).
fast_gpu_mode = "on_demand"
fast_idle_unload_s = 60        # on_demand only (<= 0 means 60)
fast_models = ["qwen35-4b", "qwen35-2b"]   # the pill menu's "Fast model" choices; the choice persists
# The 35B is loaded on demand (deep_think, a fallback) and unloaded this long after its last request (as the voice
# brain: after the session).
deep_idle_unload_s = 60
# on_demand: each load restores the saved KV of the fixed prompt prefix (system prompt + tool schemas, ~8.3k
# tokens; 30 ms) instead of prefilling it (3.8 s). slot_dir must be llama-server's --slot-save-path (the `small`
# macro in ~/.config/llama-swap/config.yaml); files are ~190 MB each, the newest two per model are kept.
slot_restore = true
slot_dir = "$XDG_RUNTIME_DIR/jarvis-slots"
llama_swap_config = "~/.config/llama-swap/config.yaml"   # where "auto" below finds the fast model's GGUF
# GGUFs kept in the page cache (re-read with posix_fadvise WILLNEED when the kernel has dropped part of them,
# e.g. while a game needs the RAM). "auto" = the active fast model's file (follows the pill menu's choice). No
# mlock: RLIMIT_MEMLOCK is 8 MiB and raising it needs root. The 35B (17.7 GB) is left out on purpose.
# jarvis-pin.service (jarvis/pin.py) holds the same file(s) mapped and touched every 15 s in on_demand mode, which
# survives a 35B load; this re-read is the fallback without it.
keep_in_page_cache = ["auto"]
page_cache_refresh_s = 60

[session]
silence_timeout_s = 120        # a click-started session closes after this much silence before its first question
confirm_window_s = 8           # mic stays open this long after "Shall I send it?"
followup_s = 8                 # after JARVIS speaks, a follow-up without "Jarvis" must start within this; then
                               # only the wake word or a click opens a turn
context_keep_s = 300           # a new session keeps the conversation if the last one ended less than this ago

[ipc]
socket = ""                    # empty = $XDG_RUNTIME_DIR/jarvis.sock

[daemon]
log_level = "INFO"             # DEBUG / INFO / WARNING; jarvisd logs to stderr (journald)

[wake]
enabled = true
# One model or several with their own thresholds. The trained single-word "jarvis" (section 6, wakeword/jarvis.yaml:
# 92 % on a bare "Jarvis", 3.7 false triggers/h, all checked by Whisper) plus the bundled hey_jarvis (99 % on
# "Hey Jarvis"). Either one firing counts. Names: bundled openWakeWord names, wakeword/<name>.onnx, or paths.
model = "jarvis:0.06, hey_jarvis:0.5"
threshold = 0.5                # for any model listed without its own threshold
refractory_s = 2.0             # ignore further detections for this long
log_min_score = 0.03           # scores above this are logged at DEBUG (set [daemon] log_level = "DEBUG")
verify = true                  # 2nd stage: Whisper must hear "Jarvis" (videos can trigger openWakeWord)
verify_min_ratio = 82          # fuzzy word match vs "jarvis": jervis 83 ok; jars 80, Travis 67, service 46 rejected
verify_skip_score = 0.95       # no Whisper check at/above this score, only while no other app is playing
verify_preroll_s = 2.5         # audio before the trigger that Whisper checks ...
verify_post_ms = 300           # ... plus this much after it
verify_prompt = "Jarvis."
barge_threshold_scale = 0.75   # while JARVIS speaks: stage-1 thresholds x0.75 (a false trigger only stops him);
                               # the check then uses the GPU turbo Whisper if it is on the GPU (docs/tuning.md)
# The check runs on its own small Whisper on the CPU (no VRAM while JARVIS waits for its name). "" = use [stt].
verify_model = "base"
verify_device = "cpu"
verify_compute_type = "int8"
verify_cpu_threads = 4
verify_min_score = -1.0        # decoder confidence floor: base + "Jarvis." accepts 93.5 % of real "Jarvis"es and 0/100
                               # windows of real dialogue (turbo: 93.0 %, 6/100); docs/tuning.md "Wake check on the CPU"

[audio]
voice_enabled = true           # false = no mic / wake word / TTS; typed and IPC input still work
echo_cancel = true             # load PipeWire module-echo-cancel at runtime (jarvis_ec_source / jarvis_ec_sink)
mic = "alsa_input.usb-MUSIC-BOOST_Trust_GXT_242_Microphone-00.mono-fallback"
speaker = ""                   # empty = the current default sink
ec_method = "webrtc"
ec_args = "webrtc.noise_suppression=false webrtc.gain_control=false webrtc.high_pass_filter=true"  # NS/AGC confuse the VAD
level_hz = 30.0
volume_include_virtual_sinks = true   # count EasyEffects' sink too when JARVIS's output ends up on it
filler_after_s = 2.5           # no answer this long after the question: "One moment, sir." (0 = off)
duck_enabled = true            # lower other apps while JARVIS is active (the pill menu toggles it; persisted)
duck_level = 0.2               # multiplies each other stream's linear volume (0.2 ≈ -14 dB); sink volumes untouched
duck_fade_in_ms = 250
restore_fade_ms = 600
duck_restore_grace_s = 1.0     # other apps come back this long after JARVIS stops speaking
duck_idle_restore_s = 8.0      # ... or this long after a wake/click when nothing is said
vad_threshold = 0.5
vad_silence_ms = 700           # end the turn after this much silence
vad_max_turn_s = 30.0

[stt]
model = "large-v3-turbo"
device = "cuda"
compute_type = "int8_float16"
beam_size = 1
languages = ["en", "de", "cs", "es"]  # auto-detection among these, in preference order (close calls go to the
                               # earlier one); JARVIS answers in the language heard, else English
min_free_vram_mb = 1800        # load Whisper on the CPU if the GPU has less free than this
cpu_threads = 8                # when on the CPU
on_demand = true               # GPU Whisper leaves the GPU when idle; a wake trigger / click loads it again
park_in_ram = false            # false: unloaded when idle (1.3 s reload from the page cache, overlaps the question);
                               # true: parked in RAM (~0.8 GB more RSS, 0.05 s move)
idle_unload_s = 60             # ... and it goes back to RAM this long after the session goes idle

[tts]
voice = "bm_george"            # bm_george | bm_lewis | bm_fable; samples in docs/voice-samples/
speed = 1.0
lang = "en-gb"
model_dir = "~/models/kokoro"  # kokoro-v1.0.onnx + voices-v1.0.bin
piper_dir = "~/models/piper"   # Piper voices for the languages Kokoro can't speak (docs/voice.md)

[tts.voices]                   # JARVIS answers in the language he heard; one voice per language
en = "kokoro:bm_george"
es = "kokoro:em_alex"
de = "piper:de_DE-thorsten-high"
cs = "piper:cs_CZ-jirka-medium"

[email]
# Gmail. The login credentials live in the system keyring (service "jarvis-gmail"), never in this file:
# run `jarvisctl setup email`.
enabled = true
imap_host = "imap.gmail.com"
imap_port = 993                # SSL
smtp_host = "smtp.gmail.com"
smtp_port = 587                # STARTTLS
primary_only = true            # only the Primary inbox category
cache_size = 50                # newest INBOX headers cached for the HUD
idle_renew_s = 240             # re-IDLE (and re-sync) every 4 min: a safety net if a push is lost

[contacts]
default_region = "CZ"          # phone numbers without a country code are read as this region

[news]
# Headlines from RSS/Atom feeds (section 11), for get_news and the HUD's Headlines panel. Read-only.
enabled = true
ttl_s = 900                    # a feed is fetched again after 15 min (cached in memory and cache.db)
refresh_s = 900                # the HUD headlines refresh this often
timeout_s = 8.0
max_feed_bytes = 5000000
widget_items = 8               # headlines in the widgets event, mixed across categories
user_agent = "Mozilla/5.0 (X11; Linux x86_64) JARVIS/0.1 (personal voice assistant; RSS reader)"
# category: world | czech | tech | business | science. A [[news.feeds]] list in your own config replaces this one.
# Every URL below was checked live on 2026-09-25.
[[news.feeds]]
name = "BBC News"
url = "https://feeds.bbci.co.uk/news/world/rss.xml"
category = "world"
language = "en"
[[news.feeds]]
name = "The Guardian"
url = "https://www.theguardian.com/world/rss"
