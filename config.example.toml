[web]
# Web search and page reading (section 11). Read-only: nothing is ever posted anywhere.
enabled = true
backend = "ddgs"               # "ddgs" (the ddgs package: DuckDuckGo & co., no API key) | "searxng"
searxng_url = ""               # for backend = "searxng", e.g. "http://127.0.0.1:8888" (not 3000/8085/8086/8090/8099)
ddgs_backend = "auto"          # the ddgs package's engine choice for text search ("auto", "duckduckgo", "bing", ...)
ddgs_news_backend = "yahoo"    # for recent=true (news); falls back to "auto". ddgs misdated Bing news items (2026-09-25)
region = "wt-wt"               # no region; e.g. "cz-cs" or "uk-en"
safesearch = "moderate"
min_interval_s = 2.0           # at least 2 s between two searches
timeout_s = 10.0
page_max_bytes = 3000000       # read_webpage never downloads more than 3 MB
page_max_chars = 6000          # the extracted article is trimmed to about this length
user_agent = "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0"

[weather]
# Open-Meteo (no API key). The location follows Noctalia's auto-location file; city/lat/lon are the fallback.
enabled = true
location_file = "~/.cache/noctalia/location.json"   # "" = always use city/lat/lon below
city = "Prague"
lat = 50.0755
lon = 14.4378
ttl_s = 900                    # fetched again after 15 min (or at once when the location changes)
timeout_s = 8.0
url = "https://api.open-meteo.com/v1/forecast"

[reminders]
# Reminders and timers live in cache.db and survive restarts. Times are in [persona] timezone.
startup_grace_s = 20.0         # ones missed while jarvisd was down fire once the voice is up (at most this late)
keep_done_days = 7

[calendar]
# Optional, read-only: Google Calendar → Settings → your calendar → "Secret address in iCal format".
# Empty = no calendar; the HUD's Today panel then shows reminders and timers only.
ics_url = ""
refresh_s = 600                # polled every 10 min
timeout_s = 10.0
max_bytes = 5000000

[system]
poll_s = 1.0                   # CPU/RAM/VRAM/GPU/disk, polled ONLY while the HUD is open
disk_path = "/"
model_processes = ["llama-server"]   # their RSS is shown as the model's RAM

[manners]
# Section 13: conversation manners.
barge_in = true                # "Jarvis" while he speaks silences him at once (before Whisper verifies it)
barge_fade_ms = 40
barge_ignore_ms = 300          # ignore triggers in the first 300 ms of each spoken chunk (echo onset)
stop_words = true              # "stop" / "enough" / "quiet" / "wait" / "přestaň" / "počkej" … while he speaks
stop_min_speech_ms = 400
stop_max_speech_s = 3.0
mic_busy = true                # stop listening while another app records the mic (hyprvoice dictation, calls)
mic_busy_resume_s = 1.0        # listen again 1 s after it stopped
mic_busy_poll_s = 3.0
mic_busy_sources = []          # extra sources that count as the mic
mic_busy_ignore = ["noctalia", "peak detect", "pavucontrol", "pwvucontrol", "cava", "easyeffects"]
addressed_check = true         # only answer turns meant for JARVIS (rules + a fast-model check)
addressed_budget_ms = 300
addressed_fail_open = true     # the check didn't answer in time: keep a normal-length turn
wake_max_words_before = 3      # "… four words Jarvis …" mid-sentence = talking about him
long_speech_s = 15.0           # a turn this long without "Jarvis" at its start is treated as dictation ...
long_speech_min_confidence = 0.85   # ... unless the check is at least this sure it's for JARVIS
require_name = true            # react ONLY when called by name, also inside a session ("Jarvis, …", "…, Jarvis?");
                               # exceptions: the turn right after the wake word, the first question after a click,
                               # yes/no in the confirm window, stop words while he speaks. No LLM classifier then.
barge_listen_s = 6.0           # after any barge-in trigger he stays stopped and listens this long (name needed)

[desktop]
# Section 14: open apps (XDG desktop entries only), URLs, folders, media, workspaces, screenshots, lock.
enabled = true
launcher = "auto"              # auto = `uwsm app -- <id>.desktop` if uwsm is installed, else gtk-launch
screenshot_dir = "~/Pictures/Screenshots"
lock_command = "~/.config/hypr/Scripts/lock.sh"   # what SUPER+L runs; falls back to hyprlock
terminal = ["ghostty", "--gtk-single-instance=false"]  # Terminal=true apps (nvim, btop) open inside this
[desktop.app_aliases]          # spoken name -> desktop id, for names the fuzzy match gets wrong
# music = "io.github.quodlibet.QuodLibet"
"text editor" = "nvim"         # the user's editor is Neovim (2026-09-28), in a Ghostty window
"code editor" = "nvim"
"editor" = "nvim"
"notepad" = "nvim"
"neovim" = "nvim"
"vim" = "nvim"

[files]
# Section 14: create_file / append_to_file / read_file / list_folder. New files in these roots are created
# directly; overwrites and anything outside them need the user's confirmation. Dotfiles, ~/.config, ~/.ssh,
# ~/.local and anything outside $HOME are always refused.
default_folder = "~/Documents/JARVIS"
roots = ["~/Documents", "~/Desktop", "~/Downloads", "~/Projects", "~/Pictures", "~/Music", "~/Videos"]
max_bytes = 1000000
read_max_bytes = 200000

[coding]
# Section 15: "code me a project" runs opencode in a ghostty window on a heavier Ollama model (the voice stays on
# the small model). A confirm card comes first; ~/Projects/<name> must be new or empty.
enabled = true
model = "qwen3.8:27b-mtp-q4_K_M"   # Ollama tag; qwen3.6:27b-coding-mtp-q4_K_M is the other candidate
num_ctx = 32768                    # Ollama's default here is 4096 (too small for opencode): a derived model
                                   # jarvis-coder:<model>-32k with this context is created on first use (0 = off)
ollama_url = "http://127.0.0.1:11434"
projects_dir = "~/Projects"
opencode_bin = ""                  # "" = find it
terminal = ["ghostty", "--gtk-single-instance=false"]
app_launcher = "auto"              # uwsm app (own scope, survives a jarvisd restart), else systemd-run --scope
min_free_vram_gb = 6.0             # a fullscreen game or less free VRAM than this: the card warns first
game_classes = ["steam_app_", "gamescope", ".exe", "lutris", "heroic", "wine", "proton", "retroarch", "minecraft"]
unload_smart_model = true          # unload the 35B through llama-swap first (the voice model and STT stay)
warm_up = true                     # load the model and measure tok/s before the terminal opens
keep_alive_after = "5m"            # Ollama keeps the model this long after the job ends
max_task_chars = 4000

[commands]
# Section 17: "run htop" / "start the training". Every command is a confirm card first (button: Run), then runs in a
# ghostty window the user watches (bash -lc, in the workdir). sudo/su/doas/pkexec/run0, rm -rf of ~ or /, mkfs,
# dd to a device, fork bombs, curl|sh, writes into ~/.ssh ~/.gnupg /etc and non --user systemctl are always refused.
enabled = true
default_workdir = "~"              # an existing folder inside $HOME
terminal = ["ghostty", "--gtk-single-instance=false"]
app_launcher = "auto"              # uwsm app (own scope, survives jarvisd stopping), else systemd-run --scope
max_chars = 2000
training_unit = "jarvis-finetune"
training_script = "~/jarvis/finetune/start.sh"   # section 16: starts the unit with memory/CPU limits; stops jarvisd while it trains
training_status_file = "~/jarvis/finetune/STATUS"
training_hours = "12–13"
training_start_delay_s = 8.0       # "Starting the training…" is spoken first, then the terminal opens
update_check_timeout_s = 120.0     # system_update_check: checkupdates (pacman-contrib), read-only

[firm]
# Section 18: Geonix Wrench's numbers (monthly earnings, total earned, subscribers, job cards/PDFs, signups) from
# the backend's read-only GET /api/summary behind Cloudflare Access. The URL and the service token live in the
# keyring (service jarvis-firm-geonix): run `jarvisctl setup firm geonix`. Until then the firm is "not connected".
enabled = true
provider = "geonix"
refresh_s = 900                    # every 15 min while jarvisd runs (at most one request a minute)
timeout_s = 10.0
stale_after_s = 1800               # older numbers are marked stale (a failed refresh keeps the last good ones)

[briefing]
# Section 18: the first wake word or click of the day (in [persona] timezone) gives a two-sentence briefing
# instead of "Yes, sir?": the firm's numbers, today's reminders and events, the weather. Nothing while muted.
# The pill's right-click menu ("Daily briefing") overrides this and remembers the choice (state.json).
enabled = true

[showcase]
# Section 24: "Jarvis, present yourself" / "who are you" / "show me what you can do" (also de/cs/es) runs a scripted
# demonstration: JARVIS speaks while it opens YouTube in a new Zen window and Writer on empty workspaces and types a
# text. No model involved. Edit the script (spoken lines, steps, text, languages) in ~/.config/jarvis/showcase.toml;
# check it with `uv run python -m jarvis.integrations.showcase check`. Stop it: "stop", Escape or move the mouse.
enabled = true
script = ""                    # "" = ~/.config/jarvis/showcase.toml (copied from jarvis/showcase.default.toml on first use)
mute = false                   # true: nothing is spoken (the steps still run)

[computer]                     # section 19: type_text / press_keys / mouse, and computer_task (screenshot → 35B vision → mouse/keyboard)
enabled = true
confirm = false                # section 21: computer_task starts at once ("Taking control, sir."); true brings back the "Take control?" card
max_steps = 40                 # one screenshot + one action per step
max_seconds = 300
image_width = 1280             # screenshots are downscaled in memory; never written to disk unless debug_screenshots
jpeg_quality = 80
settle_s = 0.7                 # wait after an action before the next screenshot
step_timeout_s = 90            # one vision call (the first one may load the 35B)
takeover_mouse_px = 25         # moving the real mouse this much (evdev units, 0.5 s) stops the task
debug_screenshots = false      # true: keep each step's screenshot in ~/.local/state/jarvis/computer/
# Section 23: faster steps (numbers in docs/tuning.md). The step model runs every step fully on the GPU: the 4B with
# its vision projector (llama-swap `qwen35-4b-vision`, ~4.4 GB, loaded when a task starts, unloaded a minute after).
# The section 19 loop (the 35B for every step, ~5-25 s a step): step_model = "jarvis", prompt = "full",
# max_actions = 1, settle = "fixed", verify_done = false, zoom_retry = false.
step_model = "qwen35-4b-vision"
escalate_model = ""            # e.g. "jarvis": the 35B takes a step over when stuck (measured: no gain, much slower)
prompt = "fast_note"           # "fast_note": short prompt + a 12-word screen note; "fast": no note; "full": section 19's
max_actions = 4                # actions one reply may carry for one screenshot (the batch stops if the window changes)
step_max_tokens = 200
step_temperature = 0.0
verify_done = true             # the step model checks its own "done" once more before it is believed
zoom_retry = true              # a click that changed nothing is re-aimed on a 4x zoomed crop around it
history_steps = 6              # earlier steps sent as text (never old screenshots)
settle = "adaptive"            # wait until the screen stops changing (grim every ~0.1 s), at most settle_max_s; "fixed" = settle_s
settle_max_s = 1.5
escalate_after = 2             # steps without a visible change before escalate_model looks
give_up_after = 4              # steps in a row without a visible change end the task ("I'm stuck"); 0 = off
vram_need_mb = 5500            # free VRAM the 35B needs before it loads for vision (else the voice model leaves the GPU)
step_vram_need_mb = 5000       # the same for a small step model
direct = true                  # "open X", "search the web for Y", "open YouTube and ..." start with open_app / open_url
search_url = "https://duckduckgo.com/?q={q}"   # Zen's search engine
