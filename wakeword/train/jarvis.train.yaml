  - "jar lid"
  - "jargon"
  - "charming"
  - "Carlos"
  - "Marcus"
  - "Jarrah"
  - "chores"
  - "just"
  - "yes"
  - "thanks"
  - "stop"
  - "hello"

noise_scales: [0.667, 0.98]
noise_scale_ws: [0.8, 0.98]
length_scales: [0.75, 0.9, 1.0, 1.15, 1.3]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: /home/daniel/jarvis/wakeword/data/lk
output_dir: /home/daniel/jarvis/wakeword/data/lk/output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 2
  background_paths: [/home/daniel/jarvis/wakeword/data/lk/backgrounds]
  rir_paths: [/home/daniel/jarvis/wakeword/data/lk/rirs]

model:
  model_type: conv_attention
  model_size: medium

steps: 60000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.2

batch_n_per_class:
  positive: 64
  adversarial_negative: 96
  ACAV100M_sample: 1024
  background_noise: 32
