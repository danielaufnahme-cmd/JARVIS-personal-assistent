<!doctype html><html><head><meta charset="utf-8"><title>jarvis-sandbox-23 · contact form</title>
<link rel="stylesheet" href="common.css"></head><body>
<header><span class="brand">Acme Support</span><a href="#">Help centre</a><a href="#">Status</a></header>
<main><h1>Contact us</h1>
<form id="f" onsubmit="return send()">
<label for="name">Name</label><input id="name" type="text" placeholder="Your full name" autocomplete="off">
<label for="email">Email</label><input id="email" type="text" placeholder="you@example.com" autocomplete="off">
<label for="topic">Topic</label><input id="topic" type="text" placeholder="Optional" autocomplete="off">
<p style="margin-top:22px"><button type="submit" class="primary">Send</button> <button type="reset">Clear</button></p>
</form>
<div id="st" class="status"></div></main>
<script>
function send(){ const n=document.getElementById('name').value.trim(), e=document.getElementById('email').value.trim();
  const st=document.getElementById('st'); st.textContent='Sent: '+n+' <'+e+'>'; st.classList.add('show');
  document.title='jarvis-sandbox-23 · contact form · sent: '+n+' | '+e; return false; }
</script></body></html>
