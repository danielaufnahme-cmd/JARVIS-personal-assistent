<!doctype html><html><head><meta charset="utf-8"><title>jarvis-sandbox-23 · settings</title>
<link rel="stylesheet" href="common.css"><style>.row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid #e3e6ec}
.sw{width:52px;height:28px;border-radius:14px;background:#c3c8d2;border:0;position:relative;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:#2f6fed}.sw.on::after{left:27px}.desc{color:#6b7280;font-size:13px}</style></head><body>
<header><span class="brand">Notely</span><a href="#">Notes</a><a href="#">Settings</a></header>
<main><h1>Settings</h1><div id="list"></div></main>
<script>
const names=["Sync notes","Spell check","Auto-save","Show word count","Compact list","Open links in new tab","Smart quotes",
"Markdown shortcuts","Line numbers","Show tags","Show backlinks","Daily note","Weekly summary email","Sound effects",
"Desktop notifications","Start on login","Show tray icon","Confirm before delete","Trash auto-empty","Show hidden notes",
"Sort by date","Group by folder","Pin favourites","Wide layout","Large text","Reduce motion","High contrast","Dark mode",
"Beta features","Usage statistics"];
const on=new Set(["Sync notes","Spell check","Auto-save"]); const list=document.getElementById('list'); const changed=new Set();
function upd(){ document.title='jarvis-sandbox-23 · settings'+(changed.size?' · changed: '+[...changed].map(n=>n+'='+(on.has(n)?'on':'off')).join(', '):''); }
names.forEach(n=>{ const r=document.createElement('div'); r.className='row';
 r.innerHTML=`<div><div>${n}</div><div class="desc">Applies to all notebooks</div></div><button class="sw${on.has(n)?' on':''}" aria-label="${n}"></button>`;
 const b=r.querySelector('button'); b.onclick=()=>{ if(on.has(n)) on.delete(n); else on.add(n); b.classList.toggle('on'); changed.add(n); upd(); };
 list.appendChild(r); });
</script></body></html>
