<!doctype html><html><head><meta charset="utf-8"><title>jarvis-sandbox-23 · resize image</title>
<link rel="stylesheet" href="common.css"></head><body>
<header><span class="brand">Pixelbox</span><a href="#">Library</a><a href="#">Edit</a></header>
<main><h1>Resize image</h1><p>holiday-photo.jpg · currently 800 × 600</p>
<label for="w">Width (px)</label><input id="w" type="text" value="800" autocomplete="off">
<label for="h">Height (px)</label><input id="h" type="text" value="600" autocomplete="off">
<p style="margin-top:22px"><button class="primary" onclick="apply()">Apply</button> <button>Cancel</button></p>
<div id="st" class="status"></div></main>
<script>function apply(){const w=document.getElementById('w').value.trim(),h=document.getElementById('h').value.trim();
const st=document.getElementById('st');st.textContent='Resized to '+w+' × '+h;st.classList.add('show');
document.title='jarvis-sandbox-23 · resize image · applied '+w+'x'+h;}</script></body></html>
