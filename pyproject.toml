[project]
name = "jarvis"
version = "0.1.0"
description = "Local voice assistant: wake word, local Qwen, approval-gated email/SMS, Quickshell UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bashlex>=0.18",
    "dateparser>=1.4.3",
    "ddgs>=9.16.0",
    "evdev>=2.0.0",
    "faster-whisper>=1.2.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "imap-tools>=1.15.0",
    "keyring>=25.7.0",
    "kokoro-onnx>=0.6.1",
    "num2words>=0.5.14",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "nvidia-ml-py>=13.615.71",
    "onnxruntime>=1.30.0",
    "openai>=3.19.2",
    "openwakeword>=0.4.0",
    "phonenumbers>=9.0.40",
    "pillow>=12.3.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "rapidfuzz>=3.14.6",
    "recurring-ical-events>=3.8.2",
    "sounddevice>=0.5.6",
    "trafilatura>=2.2.0",
]

[project.scripts]
jarvisd = "jarvis.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "trustme>=1.2.1",
]
